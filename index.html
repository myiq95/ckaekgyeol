<style>

svg.i{width:22px;height:22px}

.hd h2{margin:0;font:700 24px 'Gowun Batang','Nanum Myeongjo',serif;letter-spacing:.12em;flex:1}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.tabs{position:relative;display:flex;gap:6px;padding:8px 16px;}
.tabs button{padding:8px 16px;border-radius:20px;font-size:14px;color:var(--sub)}
.tabs button.on{background:var(--ink);color:var(--bg)}

.cv{flex:none;width:46px;height:64px;border-radius:4px 8px 8px 4px;display:grid;place-items:center;color:#f1ead8;font:700 20px 'Gowun Batang',serif;box-shadow:inset 3px 0 0 rgba(0,0,0,.25)}
.inf{flex:1;min-width:0}
.tt{font-size:15.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.mt{font-size:12px;color:var(--sub);margin:5px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{height:3px;background:var(--line);border-radius:2px}.pb i{display:block;height:100%;background:var(--acc);border-radius:2px}
.bk .ib{width:34px;height:34px;color:var(--sub)}
.empty{position:relative;text-align:center;color:var(--sub);padding:80px 20px;line-height:1.8;font-size:14px}
/* reader */
#rd{overflow:auto;-webkit-overflow-scrolling:touch}
#rd.on{display:block}
#bk{position:relative;max-width:660px;margin:0 auto;padding:calc(var(--top) + 44px) 24px calc(var(--bot) + 90px);font-size:var(--fs);letter-spacing:var(--ls);line-height:var(--lh);word-break:keep-all;overflow-wrap:break-word}

html.web{--top:env(safe-area-inset-top,0px)}

</head>

  const ct=ps(await rd('META-INF/container.xml'),'application/xml'),op=ct.querySelector('rootfile').getAttribute('full-path'),dir=op.includes('/')?op.replace(/[^/]*$/,''):'',o=ps(await rd(op),'application/xml'),man={};
  o.querySelectorAll('manifest > item').forEach(i=>man[i.getAttribute('id')]=i.getAttribute('href'));const out=[];
  for(const r of o.querySelectorAll('spine > itemref')){const h=man[r.getAttribute('idref')];if(!h)continue;const f=z.file(dir+decodeURIComponent(h))||z.file(dir+h);if(!f)continue;const d=ps(decode(await f.async('uint8array')),'text/html');out.push(domText(d.body))}
  const tt=o.querySelector('title')?.textContent?.trim();const r=build(out.join('\n'),n,0);if(tt)r.title=tt;return r}

async function addFiles(fs){if(!fs.length)return;const all=await dbAll();let last=null;
 for(const f of fs){try{toast('불러오는 중… '+f.name,0);const key=f.name+':'+f.size,ex=all.find(b=>b.key==key);if(ex){last=ex;continue}const r=await extract(f);if(!r.chs.length)throw new Error('읽을 수 있는 텍스트가 없어요');last=Object.assign(r,{id:Date.now()+Math.random(),key,ch:0,p:0,done:false,t:Date.now(),pct:0});await dbPut(last)}catch(e){toast(f.name+': '+(e.message||'열 수 없어요'),3500)}}

async function renderLib(){const all=(await dbAll()).sort((a,b)=>b.t-a.t),rd=all.filter(b=>!b.done),dn=all.filter(b=>b.done),tab=$('#t1').classList.contains('on')?1:0,L=tab?dn:rd;
 $('#t0').textContent=`읽는 중 ${rd.length}`;$('#t1').textContent=`다 읽음 ${dn.length}`;
 $('#list').innerHTML=L.length?L.map(b=>{let h=0;for(const c of b.title)h=(h*31+c.charCodeAt(0))%360;return`<div class="bk" data-id="${b.id}"><div class="cv" style="background:hsl(${h} 28% 32%)">${esc([...b.title][0]||'책')}</div><div class="inf"><div class="tt">${esc(b.title)}</div><div class="mt">${Math.round(b.pct||0)}% · ${esc(b.chs[b.ch]?.t||'')}</div><div class="pb"><i style="width:${b.pct||0}%"></i></div></div><button class="ib" data-dn="${b.id}">${ic('check')}</button><button class="ib" data-del="${b.id}">${ic('trash')}</button></div>`}).join(''):`<div class="empty">${tab?'아직 다 읽은 책이 없어요.':'서재가 비어 있어요.<br>파일을 열거나 글을 붙여넣어 보세요.'}</div>`}
$('#list').onclick=async e=>{const d=e.target.closest('[data-del]'),n=e.target.closest('[data-dn]'),b=e.target.closest('.bk');

 if(n){const x=(await dbAll()).find(k=>k.id==+n.dataset.dn);x.done=!x.done;await dbPut(x);renderLib();return}
 if(b){const x=(await dbAll()).find(k=>k.id==+b.dataset.id);x&&openBook(x)}};
$('#t0').onclick=()=>{$('#t0').classList.add('on');$('#t1').classList.remove('on');renderLib()};
$('#t1').onclick=()=>{$('#t1').classList.add('on');$('#t0').classList.remove('on');renderLib()};
/* reader */
const R=$('#rd'),BK=$('#bk'),QR=/(“[^”]*”|"[^"]*"|「[^」]*」|『[^』]*』)/,SEP=/^(\*\s*){3,}$|^[-=~─—_◇◆#]{3,}$/;
function segs(s){if(SEP.test(s))return[{s,x:1}];const p=s.split(QR).filter(x=>x.trim());if(p.length==1&&/^[“"「『—–]/.test(s))return[{s,q:1}];return p.map(x=>({s:x.trim(),q:/^(“|"|「|『)/.test(x)}))}
function openBook(b){cur=b;show('rd');renderCh(b.ch,b.p)}
function renderCh(i,p=0){const c=cur.chs[i],n=cur.chs.length;let h='';cur.ch=i;
 if(i==0)h+=`<h1>${esc(cur.title)}</h1>`;if(!cur.auto)h+=`<h2>${esc(c.t)}</h2>`;
 c.p.forEach((s,k)=>segs(s).forEach((g,j)=>{const a=j?'':` data-i="${k}"`;h+=g.x?`<div class="sep"${a}>◆ ◆ ◆</div>`:g.q?`<blockquote class="t"${a}>${esc(g.s)}</blockquote>`:`<p class="t"${a}>${esc(g.s)}</p>`}));
 h+=`<div class="nav">${i>0?'<button data-go="-1">이전 장</button>':''}${i<n-1?'<button data-go="1">다음 장</button>':'<div class="end">마지막 장이에요</div>'}</div>`;
 BK.innerHTML=h;R.scrollTop=0;if(p>0){const e=BK.querySelector(`[data-i="${p}"]`);e&&(R.scrollTop=e.offsetTop-70)}
 document.body.classList.remove('hide');saveNow()}
BK.onclick=e=>{const g=e.target.closest('[data-go]');if(g){ttsStop();renderCh(cur.ch+ +g.dataset.go);return}document.body.classList.toggle('hide')};
let lastTop=0,st;
R.onscroll=()=>{const t=R.scrollTop,d=t-lastTop;if(t<20||d<-8)document.body.classList.remove('hide');else if(d>8)document.body.classList.add('hide');lastTop=t;clearTimeout(st);st=setTimeout(saveNow,350)};
function saveNow(){if(!cur||view!='rd')return;const m=R.scrollHeight-R.clientHeight,f=m>0?Math.min(1,R.scrollTop/m):1,es=BK.querySelectorAll('[data-i]');let p=0;for(const e of es){if(e.offsetTop+e.offsetHeight>R.scrollTop+60){p=+e.dataset.i;break}}
 cur.p=p;cur.pct=Math.min(100,(cur.ch+f)/cur.chs.length*100);if(cur.ch==cur.chs.length-1&&f>.97){cur.done=true;cur.pct=100}cur.t=Date.now();$('#pg').style.width=cur.pct+'%';dbPut(cur)}
/* toc */
$('#bToc').onclick=()=>{$('#toc').innerHTML=(cur.auto?'<div style="font-size:12px;color:var(--sub);padding:0 4px 8px">제목을 찾지 못해 임의 목차로 나눴어요.</div>':'')+cur.chs.map((c,i)=>`<button data-c="${i}" class="${i==cur.ch?'on':''}">${esc(c.t)}</button>`).join('');$('#ovToc').classList.add('on');const o=$('#toc .on');o&&setTimeout(()=>o.scrollIntoView({block:'center'}),30)};
$('#toc').onclick=e=>{const b=e.target.closest('[data-c]');if(b){ttsStop();$('#ovToc').classList.remove('on');renderCh(+b.dataset.c)}};
$$('.ov').forEach(o=>o.onclick=e=>{if(e.target==o)o.classList.remove('on')});
$('#bBack').onclick=()=>{$('#ovSet').classList.remove('on');saveNow();show('lib')};
/* settings */
$('#bSet').onclick=()=>$('#ovSet').classList.add('on');
$('#fSel').innerHTML=Object.entries(FONTS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');
$('#fSel').onchange=e=>{S.font=e.target.value;applySet()};
$('#fIn').oninput=e=>{S.custom=e.target.value;applySet()};
[['rFs','fs'],['rLs','ls'],['rLh','lh'],['rRt','rate']].forEach(([id,k])=>$('#'+id).oninput=e=>{S[k]=+e.target.value;applySet()});

/* tts (기기 시스템 음성 = speechSynthesis) */
let speaking=false,q=[],qi=0;
function loadVoices(){const v=(speechSynthesis.getVoices?speechSynthesis.getVoices():[]).filter(x=>/^ko/i.test(x.lang));$('#vSel').innerHTML=v.length?v.map(x=>`<option value="${x.voiceURI}">${x.name}</option>`).join(''):'<option value="">기본 한국어 음성</option>';if(S.voice)$('#vSel').value=S.voice}
if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function ttsStop(){speaking=false;q=[];if('speechSynthesis'in window)speechSynthesis.cancel();$$('.hl').forEach(e=>e.classList.remove('hl'));$('#bTts').innerHTML=ic('play')}
function ttsPlay(){if(!('speechSynthesis'in window))return toast('이 기기는 음성 읽기를 지원하지 않아요');
 const els=[...BK.querySelectorAll('.t')];let s=els.findIndex(e=>e.offsetTop+e.offsetHeight>R.scrollTop+60);if(s<0)s=0;
 q=[];els.slice(s).forEach(el=>{(el.textContent.match(/[^.!?。…]+[.!?。…”"」』]*\s*/g)||[el.textContent]).forEach(t=>t.trim()&&q.push({el,t:t.trim()}))});
 speaking=true;qi=0;$('#bTts').innerHTML=ic('stop');speechSynthesis.cancel();next()}
function next(){if(!speaking)return;$$('.hl').forEach(e=>e.classList.remove('hl'));if(qi>=q.length){if(cur.ch<cur.chs.length-1){renderCh(cur.ch+1);return setTimeout(ttsPlay,300)}return ttsStop()}
 const it=q[qi++],u=new SpeechSynthesisUtterance(it.t);u.lang='ko-KR';u.rate=S.rate;const v=speechSynthesis.getVoices().find(x=>x.voiceURI==S.voice);if(v)u.voice=v;
 it.el.classList.add('hl');const r=it.el.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-80)R.scrollTo({top:R.scrollTop+r.top-innerHeight/3,behavior:'smooth'});
 u.onend=next;u.onerror=()=>{speaking&&next()};speechSynthesis.speak(u)}
$('#bTts').onclick=()=>{$('#ovSet').classList.remove('on');speaking?ttsStop():ttsPlay()};
/* home / pickers */

$('#lib').insertAdjacentHTML('afterbegin',art());$('#rd').insertAdjacentHTML('afterbegin','<div style="position:fixed;top:0;left:0;right:0;height:var(--H,100vh);opacity:.12;pointer-events:none">'+art()+'</div>');
$('#toHome').innerHTML=ic('home');$('#addF').innerHTML=ic('file');$('#bBack').innerHTML=ic('back');$('#bToc').innerHTML=ic('toc');$('#bTts').innerHTML=ic('play');

 const b=Object.assign(r,{id:Date.now()+Math.random(),key:'paste:'+Date.now(),ch:0,p:0,done:false,t:Date.now(),pct:0});await dbPut(b);$('#ovPaste').classList.remove('on');$('#pText').value='';$('#pTitle').value='';openBook(b)};

if(!FONTS[S.font])S.font='sys';

/* PWA: 아이콘 & manifest 생성 */
function icon(z){const c=document.createElement('canvas');c.width=c.height=z;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,z);g.addColorStop(0,'#1d2842');g.addColorStop(1,'#0c1018');x.fillStyle=g;x.fillRect(0,0,z,z);
